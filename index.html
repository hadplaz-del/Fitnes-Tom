<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fit režim PRO</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
body { font-family: Arial; margin: 15px; background: #f2f4f7; }
.card { background: white; padding: 15px; border-radius: 12px; margin-bottom: 15px; }
h1 { font-size: 22px; }
button { padding: 8px 12px; border: none; border-radius: 6px; background: #007bff; color: white; }
.done { text-decoration: line-through; color: gray; }
.bad { color: red; }
.ok { color: orange; }
.good { color: green; }
.weekend { border-left: 5px solid red; }
</style>
</head>
<body>

<h1>💪 Fit režim PRO</h1>

<div class="card" id="dayCard">
<h2 id="day"></h2>
<p id="training"></p>
</div>

<div class="card">
<h3>✔️ Denní úkoly</h3>
<ul id="tasks"></ul>
</div>

<div class="card">
<h3>📊 Skóre dne</h3>
<p id="score"></p>
</div>

<div class="card">
<h3>⚖️ Váha</h3>
<input type="number" id="weightInput" placeholder="kg">
<button onclick="saveWeight()">Uložit</button>
</div>

<div class="card">
<h3>📈 Vývoj váhy</h3>
<canvas id="chart"></canvas>
</div>

<script>
const days = ["Ne", "Po", "Út", "St", "Čt", "Pá", "So"];
const today = new Date().getDay();
const todayKey = new Date().toISOString().slice(0,10);

document.getElementById("day").innerText = "Dnes: " + days[today];

if(today === 0 || today === 6){
  document.getElementById("dayCard").classList.add("weekend");
}

let training = "";
switch(today){
  case 1:
  case 4:
    training = "🔴 Trénink A";
    break;
  case 2:
  case 5:
    training = "🔵 Trénink B";
    break;
  case 3:
    training = "🚶‍♂️ Chůze / volno";
    break;
  case 6:
    training = "🚴 Lehký pohyb";
    break;
  default:
    training = "🛌 Volno";
}
document.getElementById("training").innerText = training;

const tasks = [
  "Trénink / pohyb",
  "8 000 kroků",
  "3 jídla bez zobání",
  "Bez večerního dojídání"
];

let saved = JSON.parse(localStorage.getItem("tasks-"+todayKey)) || {};

const list = document.getElementById("tasks");

tasks.forEach((task, i) => {
  let li = document.createElement("li");
  let btn = document.createElement("button");

  if(saved[i]) li.classList.add("done");

  btn.innerText = "✔";
  btn.onclick = () => {
    li.classList.toggle("done");
    saved[i] = !saved[i];
    localStorage.setItem("tasks-"+todayKey, JSON.stringify(saved));
    updateScore();
  };

  li.append(task + " ");
  li.appendChild(btn);
  list.appendChild(li);
});

function updateScore(){
  let values = Object.values(saved);
  let done = values.filter(v => v).length;
  let total = tasks.length;
  let percent = Math.round((done/total)*100);

  let text = percent + "% - ";
  let el = document.getElementById("score");

  if(percent === 100){
    el.className = "good";
    text += "Perfektní den";
  } else if(percent >= 75){
    el.className = "ok";
    text += "Dobrý, ale hlídej to";
  } else {
    el.className = "bad";
    text += "Slabý výkon";
  }

  el.innerText = text;
}

updateScore();

function saveWeight(){
  let val = document.getElementById("weightInput").value;
  if(!val) return;
  let data = JSON.parse(localStorage.getItem("weights")) || {};
  data[todayKey] = val;
  localStorage.setItem("weights", JSON.stringify(data));
  loadChart();
}

function loadChart(){
  let data = JSON.parse(localStorage.getItem("weights")) || {};
  let labels = Object.keys(data);
  let values = Object.values(data);

  new Chart(document.getElementById("chart"), {
    type: "line",
    data: {
      labels: labels,
      datasets: [{
        label: "Váha",
        data: values
      }]
    }
  });
}

loadChart();
</script>

</body>
</html>
